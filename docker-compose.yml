services:
  postgres:
    image: postgres:16-alpine
    container_name: linkup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkup
      POSTGRES_PASSWORD: linkup
      POSTGRES_DB: linkup
    ports:
      - "5432:5432"
    volumes:
      - linkup_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkup -d linkup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  linkup_pg:
